<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#18181b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>DocScan</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>
</head>
<body>
  <div id="loader" class="loader-overlay">
    <div class="spinner"></div>
    <p id="loader-text">Инициализация движка сканирования...</p>
  </div>

  <div class="app-container">
    <header class="app-header">
      <div class="title-wrap">
        <h1>DocScan</h1>
        <span id="page-count" class="badge">0 стр.</span>
      </div>
      <button id="export-pdf-btn" class="btn btn-primary" disabled>
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        Экспорт в PDF
      </button>
    </header>

    <main class="main-content">
      <div id="empty-state" class="empty-state">
        <div class="empty-icon">📄</div>
        <h3>Нет отсканированных документов</h3>
        <p>Нажмите кнопку ниже, чтобы сфотографировать лист бумаги или выбрать фото из галереи.</p>
      </div>

      <div id="pages-grid" class="pages-grid hidden"></div>
    </main>

    <footer class="bottom-bar">
      <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
      <input type="file" id="gallery-input" accept="image/*" hidden>

      <button class="btn btn-secondary action-btn" onclick="document.getElementById('gallery-input').click()">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        Галерея
      </button>

      <button class="btn btn-capture action-btn" onclick="document.getElementById('camera-input').click()">
        <div class="capture-circle"></div>
        <span>Камера</span>
      </button>
    </footer>
  </div>

  
  <canvas id="hidden-canvas" style="display: none;"></canvas>

  <script src="app.js"></script>
</body>
</html>
